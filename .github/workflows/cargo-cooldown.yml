name: Cargo dependency cooldown

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Reject newly published crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - name: Enforce Cargo dependency cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd
        with:
          # Match foundry-core: permit named package exceptions in cooldown.toml.
          strict-project-config: false
